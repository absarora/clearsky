# config/database.yml
#
# PostgreSQL configuration for all environments.
#
# Development and production use separate databases for Solid Cache, Queue,
# and Cable. Test uses a single database to simplify CI setup.
#
# Production credentials are never stored here. Provide them via:
#   - Rails encrypted credentials (preferred)
#   - DATABASE_URL environment variable

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# ─── Development ─────────────────────────────────────────────────────────────

development:
  primary: &primary_development
    <<: *default
    database: clearsky_development
  cache:
    <<: *primary_development
    database: clearsky_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
    database: clearsky_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_development
    database: clearsky_development_cable
    migrations_paths: db/cable_migrate

# ─── Test ─────────────────────────────────────────────────────────────────────
#
# Single database for all connections in test. Simplifies CI setup —
# no need to spin up separate databases for Solid Cache, Queue, and Cable.
# All test cache operations use memory_store anyway (config/environments/test.rb).

test:
  primary:
    <<: *default
    database: clearsky_test
  cache:
    <<: *default
    database: clearsky_test
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: clearsky_test
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: clearsky_test
    migrations_paths: db/cable_migrate

# ─── Production ───────────────────────────────────────────────────────────────

production:
  primary: &primary_production
    <<: *default
    database: clearsky_production
    username: clearsky
    password: <%= ENV["CLEARSKY_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: clearsky_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: clearsky_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: clearsky_production_cable
    migrations_paths: db/cable_migrate
    