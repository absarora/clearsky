# config/database.yml
#
# PostgreSQL configuration for all environments.
#
# Rails 8 uses separate databases for Solid Cache, Solid Queue, and Solid Cable
# in all environments. Each has its own migrations path under db/.
#
# Production credentials are never stored here. Provide them via:
#   - Rails encrypted credentials (preferred)
#   - DATABASE_URL / CLEARSKY_DATABASE_PASSWORD environment variables
#
# See https://guides.rubyonrails.org/configuring.html#configuring-a-database

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

# ─── Development ─────────────────────────────────────────────────────────────

development:
  primary: &primary_development
    <<: *default
    database: clearsky_development
  cache:
    <<: *primary_development
    database: clearsky_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_development
    database: clearsky_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_development
    database: clearsky_development_cable
    migrations_paths: db/cable_migrate

# ─── Test ─────────────────────────────────────────────────────────────────────
#
# Warning: the test database is erased and regenerated on each test run.
# Never set it to the same database as development.

test:
  primary: &primary_test
    <<: *default
    database: clearsky_test
  cache:
    <<: *primary_test
    database: clearsky_test_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_test
    database: clearsky_test_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_test
    database: clearsky_test_cable
    migrations_paths: db/cable_migrate

# ─── Production ───────────────────────────────────────────────────────────────
#
# Credentials are provided via environment variables or Rails encrypted credentials.
# Never commit plaintext passwords to source control.
#
# To configure via credentials:
#   EDITOR="code --wait" rails credentials:edit
#
# To configure via environment variable:
#   DATABASE_URL="postgres://user:pass@host/clearsky_production"

production:
  primary: &primary_production
    <<: *default
    database: clearsky_production
    username: clearsky
    password: <%= ENV["CLEARSKY_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: clearsky_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: clearsky_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: clearsky_production_cable
    migrations_paths: db/cable_migrate
    